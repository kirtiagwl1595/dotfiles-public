name: test
# Public repo: Actions minutes are free, so every push and PR runs on all three OSes.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.9"  # install.py and the guards promise 3.9+
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash  # Git Bash on Windows: the same shell Claude Code runs hooks in
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false  # no pyproject/uv.lock here, so the cache has no key
          python-version: ${{ matrix.python }}
      - name: Line ends stay LF (a CRLF py.sh makes the guards fail open)
        run: git ls-files --eol claude/hooks/py.sh | grep -q "i/lf.*w/lf"
      - run: uvx ruff@0.17.2 check . && uvx ruff@0.17.2 format --check .
      - run: uv run --no-project --with pytest pytest -q tests
      - name: install.py --check prints a report and changes nothing
        run: uv run --no-project python install.py --check
      - name: install.sh --check finds a Python and starts install.py
        run: bash install.sh --check
